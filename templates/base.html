<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Flask App{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background-color: #f5f0e8; }
        .navbar { background-color: #0d1b2a !important; border-bottom: 3px solid #c9a84c; }
        .navbar-brand { font-family: 'DM Serif Display', serif; color: #c9a84c !important; }
        .nav-link { color: rgba(255,255,255,0.8) !important; }
        .nav-link:hover { color: #c9a84c !important; }
        .page-header { background-color: #0d1b2a; color: white; padding: 2.5rem 0; margin-bottom: 2rem; }
        .page-header h1 { font-family: 'DM Serif Display', serif; }
        footer { background-color: #0d1b2a; color: rgba(255,255,255,0.5); text-align: center; padding: 1rem; margin-top: 3rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">SmithApp</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/favorite-course">Favorite Course</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="page-header">
        <div class="container">
            <h1>{% block page_title %}{% endblock %}</h1>
        </div>
    </div>

    <main class="container mb-5">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p class="mb-0">&copy; 2025 SmithApp &mdash; Built with Flask &amp; Bootstrap 5</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
