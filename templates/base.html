<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Flask App{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
    :root {
        --md-red:   #e21833;
        --md-black: #000000;
        --md-gold:  #fdbf38;
        --md-white: #ffffff;
        --bg-light: #f9f9f9;
    }

    body { font-family: 'DM Sans', sans-serif; background-color: var(--bg-light); }

    /* Navbar: black background, gold brand, red hover */
    .navbar { background-color: var(--md-black) !important; border-bottom: 4px solid var(--md-gold); }
    .navbar-brand { font-family: 'DM Serif Display', serif; color: var(--md-gold) !important; }
    .nav-link { color: rgba(255,255,255,0.8) !important; }
    .nav-link:hover { color: var(--md-red) !important; }

    /* Page header: red background, gold accent line */
    .page-header { background-color: var(--md-red); color: var(--md-white); padding: 2.5rem 0; margin-bottom: 2rem; border-bottom: 5px solid var(--md-gold); }
    .page-header h1 { font-family: 'DM Serif Display', serif; }

    /* Cards: gold top border */
    .card { border-top: 3px solid var(--md-gold); border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .card-title { color: var(--md-black); font-family: 'DM Serif Display', serif; }

    /* Buttons: red fill, gold hover */
    .btn-primary { background-color: var(--md-red); border-color: var(--md-red); font-weight: 600; }
    .btn-primary:hover { background-color: var(--md-black); border-color: var(--md-gold); }

    /* Footer: black background, gold top border */
    footer { background-color: var(--md-black); color: rgba(255,255,255,0.6); text-align: center; padding: 1rem; margin-top: 3rem; border-top: 4px solid var(--md-gold); }
</style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">SmithApp</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/favorite-course">Favorite Course</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="page-header">
        <div class="container">
            <h1>{% block page_title %}{% endblock %}</h1>
        </div>
    </div>

    <main class="container mb-5">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p class="mb-0">&copy; 2025 SmithApp &mdash; Built with Flask &amp; Bootstrap 5</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
